file-version: 10

# Server configs - These are settings you need to change!
# The name of the limbo server in your velocity network
limbo-name: limbo # Default "limbo"

# Direct-connect-server is the name of the server you want players to connect to if they connected directly to the server in the velocity network
direct-connect-server: lobby # Default "lobby"

# How often the server should check if it can connect
task-interval: 3000 # The time in milliseconds (Default: 3000)
reconnect-batch-size: 8 # Maximum backend queues processed per task run (Default: 8)

# How often should the user be notified of their position in the queue
queue-enabled: true # Should players be reconnected through a queue (Default: true)
queue-notify-interval: 30 # The time in seconds (Default: 30)
queue-notify-batch-size: 64 # Maximum due notifications sent per dispatcher tick (Default: 64)

# A list of disabled commands, which will not work inside the Limbo server. Recommended commands are ones that the player can use to transfer server, like /server or /hub
disabled-commands: ["server", "lobby", "hub"]

# A list of kick reasons that bypass the Limbo/reconnect flow entirely. If a player is kicked from a backend server with a reason containing any of these entries (case-insensitive), they are disconnected from the proxy instead of being sent to Limbo.
# Useful for mods that intentionally disconnect players while keeping their character on the server, like Unplugged AFK ("Your player will be AFK")
excluded-kick-reasons: [] # Default: []

# Debug/information
connection-warnings: false # Should connection failures/warnings be logged (Default: false)
debug: false # Log detailed info about virtual-host resolution, queue assignment, and ping results (Default: false)
