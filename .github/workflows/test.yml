name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven

    - name: Run reactor tests and install artifacts
      run: mvn clean install -B

    - name: Verify the API boundary
      run: |
        api_jar=$(find api/target -maxdepth 1 -type f \
          -name 'velocity-limbo-handler-api-*.jar' \
          ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
        plugin_jar=$(find plugin/target -maxdepth 1 -type f \
          -name 'velocity-limbo-handler-*.jar' \
          ! -name 'original-*' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)

        if [ -z "$api_jar" ] || [ ! -f "$api_jar" ]; then
          echo "API JAR was not produced"
          exit 1
        fi
        if [ -z "$plugin_jar" ] || [ ! -f "$plugin_jar" ]; then
          echo "Plugin JAR was not produced"
          exit 1
        fi

        if jar tf "$api_jar" | grep -q 'velocityLimboHandler/api'; then
          echo "API artifact contains implementation classes"
          exit 1
        fi
        jar tf "$plugin_jar" | grep -q 'com/akselglyholt/velocitylimbohandler/api/VelocityLimboApi.class'

    - name: Compile an external API consumer
      run: mvn test -B -f .github/consumer-smoke/pom.xml
