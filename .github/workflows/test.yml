name: Tests

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on JDK ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '21', '25' ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK ${{ matrix.java }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java }}
        distribution: 'temurin'
        cache: maven

    - name: Run reactor tests and install artifacts
      run: mvn clean install -B

    - name: Verify the API boundary
      run: |
        if jar tf api/target/velocity-limbo-handler-api-1.9.0.jar | grep -q 'velocityLimboHandler/api'; then
          echo "API artifact contains implementation classes"
          exit 1
        fi
        jar tf plugin/target/velocity-limbo-handler-1.9.0.jar | grep -q 'com/akselglyholt/velocitylimbohandler/api/VelocityLimboApi.class'

    - name: Compile an external API consumer
      run: mvn test -B -f .github/consumer-smoke/pom.xml
